[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's stable default rule set (pyflakes + common pycodestyle errors).
# E5xx (line length) is intentionally excluded — the codebase uses long
# descriptor lines for domain tables.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Env config (dotenv) and logging setup must run before importing modules that
# read environment variables or log at import time.
"backend/app.py" = ["E402"]
"backend/rag/cli.py" = ["E402"]
