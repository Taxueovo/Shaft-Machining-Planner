      <path d="M0 62H29V45H76V28H125V40H172V18H233V34H281V50H330V62H360V94H330V106H281V122H233V138H172V116H125V128H76V111H29V94H0Z" fill="url(#steel)" stroke="#d9e4f0" stroke-width="1.3"/>
