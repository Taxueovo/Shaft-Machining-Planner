      <text x="68.5" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">RAG grounded</text>
      <rect x="149" width="150" height="39" rx="8" fill="#fff" fill-opacity="0.08" stroke="#8ca5c9" stroke-opacity="0.45"/>
      <text x="224" y="25" text-anchor="middle" fill="#d5deeb" font-size="13" font-weight="650">Resource verified</text>
      <rect x="311" width="150" height="39" rx="8" fill="#fff" fill-opacity="0.08" stroke="#8ca5c9" stroke-opacity="0.45"/>
      <text x="386" y="25" text-anchor="middle" fill="#d5deeb" font-size="13" font-weight="650">Excel export</text>
    </g>
