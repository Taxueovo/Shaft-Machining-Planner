      <g>
        <circle cx="8" cy="8" r="8" fill="#2456d1"/>
        <text x="8" y="12" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">1</text>
        <text x="22" y="12" fill="#c5d1df" font-size="10" font-weight="650">TURN</text>
