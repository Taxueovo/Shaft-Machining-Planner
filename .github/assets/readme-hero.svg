<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shaft Machining Planner</title>
  <desc id="desc">An industrial engineering banner showing a stepped motor shaft and a verified machining process route.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111a28"/>
      <stop offset="0.6" stop-color="#1c2b42"/>
      <stop offset="1" stop-color="#223b62"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8fbff"/>
      <stop offset="0.22" stop-color="#aebed1"/>
      <stop offset="0.52" stop-color="#61738a"/>
      <stop offset="0.78" stop-color="#d6e0ec"/>
      <stop offset="1" stop-color="#64768c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6f9cff"/>
      <stop offset="1" stop-color="#2d64db"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8ca1bc" stroke-width="0.7" opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 290C180 250 330 335 510 296C700 255 842 323 1200 252V360H0Z" fill="#0c1420" opacity="0.35"/>
  <circle cx="1060" cy="35" r="210" fill="#2f64bd" opacity="0.16"/>

  <g transform="translate(68 62)">
    <g>
      <rect width="54" height="54" rx="14" fill="url(#blue)"/>
      <path d="M11 22h8v-6h16v6h8v10h-8v6H19v-6h-8z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M15 27h24" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="0" y="105" fill="#f5f8fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="45" font-weight="750" letter-spacing="-1.5">Shaft Machining Planner</text>
    <text x="0" y="145" fill="#b7c5d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Geometry in. Verified process route out.</text>
