name: Feature request
description: Suggest an idea or improvement for ShaftPlanner
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Describe the problem you are trying to solve
        and the behavior you would like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the feature behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you tried.
    validations:
      required: false
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which part of the project would this affect?
      options:
        - peagent backend
        - peagent frontend
        - RAG
        - Other
    validations:
      required: true
