name: Public data audit

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install "openpyxl>=3.1,<4"
      - name: Validate official sources and review freshness
        run: python scripts/verify_public_sources.py --online
