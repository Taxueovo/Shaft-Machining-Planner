name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Lint with ruff
        run: |
          ruff check backend frontend scripts start_shaftplanner.py

      - name: Scan for committed secrets
        run: python scripts/release_audit.py && python scripts/scan_secrets.py

      - name: Run backend tests
        run: pytest backend/tests -v
