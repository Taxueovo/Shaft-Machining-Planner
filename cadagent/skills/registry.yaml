# ==============================================================================
# ShaftPlanner Skill Registry
# ==============================================================================
#
# Defines all available skills/plugins in the system
# Each skill contains:
#   - name        : Unique skill name
#   - type        : Type (local/mcp_http/downloadable)
#   - path/url    : Module path or remote URL
#   - load_strategy: Loading strategy (preload/lazy/on_demand)
#
# ==============================================================================

skills:
  # --------------------------------------------------------------------------
  # Local Skills - Load directly from package modules
  # --------------------------------------------------------------------------
  - name: "feature_extractor"
    description: "CAD geometric feature extraction from BREP/STEP files"
    type: "local"
    path: "cost_pilot.skills.builtins.feature_extractor"
    load_strategy: "preload"
    metadata:
      version: "1.0.0"
      author: "ShaftPlanner Team"

  - name: "cost_calculator"
    description: "Manufacturing cost estimation based on geometric features"
    type: "local"
    path: "cost_pilot.skills.builtins.cost_calculator"
    load_strategy: "lazy"
    metadata:
      version: "1.0.0"
      author: "ShaftPlanner Team"

  - name: "design_analyzer"
    description: "CAD model design quality check"
    type: "local"
    path: "cost_pilot.skills.builtins.design_analyzer"
    load_strategy: "on_demand"
    metadata:
      version: "1.0.0"
      author: "ShaftPlanner Team"

  # --------------------------------------------------------------------------
  # MCP HTTP Skills - Call remote MCP servers via HTTP protocol
  # --------------------------------------------------------------------------
  - name: "remote_cae_assistant"
    description: "Remote CAE analysis assistant via MCP protocol"
    type: "mcp_http"
    url: "http://mcp-server:8080/mcp/v1/tools"
    load_strategy: "on_demand"
    metadata:
      version: "1.0.0"
      endpoint: "/analyze"
      timeout: 30

  # --------------------------------------------------------------------------
  # Downloadable Skills - Third-party plugins dynamically downloaded
  # --------------------------------------------------------------------------
  - name: "material_selector"
    description: "Material selection assistant (third-party plugin)"
    type: "downloadable"
    path: "https://plugins.shaftplanner.example/material_selector_v1.zip"
    load_strategy: "on_demand"
    metadata:
      version: "1.0.0"
      source: "ShaftPlanner Plugin Store"