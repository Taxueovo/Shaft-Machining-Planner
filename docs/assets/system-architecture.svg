<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">shaftmachiningplanner 职责分层</title>
  <desc id="desc">界面通过本机 API 使用运行 Harness。确定性路由、并行 Worker 和验证相互配合；任务检查点、资源样例与可选知识经验承担不同职责。示意图不表示现场设备控制。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6680a5"/></marker></defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #23324b; }
    .title { font-size: 30px; font-weight: 700; }
    .heading { font-size: 21px; font-weight: 650; }
    .label { font-size: 16px; fill: #536781; }
    .small { font-size: 14px; fill: #536781; }
    .line { fill: none; stroke: #6680a5; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1200" height="740" rx="20" fill="#f3f6fb"/>
  <text x="40" y="52" class="title">shaftmachiningplanner · 本机执行架构</text>
  <text x="40" y="82" class="label">职责分层示意 / v1.3.0 / 固定业务流程与可选模型规划共同受服务器规则约束</text>
  <rect x="40" y="112" width="1120" height="90" rx="14" fill="#1e304b"/>
  <text x="65" y="148" class="heading" style="fill:#ffffff">本机工作台 · Frontend</text>
  <text x="65" y="178" class="label" style="fill:#cfddf1">输入 / 浏览器草稿 / 任务中心 / 工程草案 / 执行记录 / 系统状态</text>
  <text x="1000" y="156" class="label" style="fill:#cfddf1">127.0.0.1:8000</text>
  <path d="M600 202V230" class="line"/>
  <rect x="40" y="234" width="1120" height="288" rx="16" fill="#e8efff" stroke="#c1d1f2"/>
  <text x="64" y="270" class="heading">Backend API + 运行 Harness</text>
  <text x="64" y="300" class="label">鉴权与输入合同 · 原子恢复 · 幂等创建 · 运行身份 · 累计预算 · 超时与取消 · Trace</text>
  <text x="996" y="270" class="small">127.0.0.1:8001</text>
  <rect x="65" y="331" width="282" height="110" rx="12" fill="#fff"/>
  <text x="86" y="365" class="heading">确定性任务路由</text>
  <text x="86" y="393" class="label">依赖 / 版本 / 有效结果复用</text>
  <text x="86" y="418" class="small">新证据才考虑可选 Planner</text>
  <rect x="424" y="331" width="352" height="110" rx="12" fill="#fff"/>
  <text x="446" y="365" class="heading">Send 并行 Worker</text>
  <text x="446" y="393" class="label">路线 / 资源 / 加工 / 质量 / 热处理</text>
  <text x="446" y="418" class="small">只读工具合同 · 隔离输入 · 单写入者收集</text>
  <rect x="853" y="331" width="282" height="110" rx="12" fill="#fff"/>
  <text x="874" y="365" class="heading">专家协调与规则验证</text>
  <text x="874" y="393" class="label">显式结论 / 必需产物验收</text>
  <text x="874" y="418" class="small">工程草案 · 待复核 · Excel 导出</text>
  <path d="M348 383H422" class="line"/><path d="M778 383H851" class="line"/>
  <path d="M984 443V485H206V443" class="line"/>
  <rect x="371" y="470" width="459" height="30" rx="8" fill="#e8efff"/>
  <text x="600" y="491" text-anchor="middle" class="small">Repair 或工程补充 → 下游失效 / 校验后继续</text>
  <path d="M600 523V551" class="line"/>
  <rect x="40" y="556" width="348" height="126" rx="14" fill="#fff" stroke="#d7e0ee"/>
  <text x="62" y="591" class="heading">本地 SQLite</text>
  <text x="62" y="620" class="label">任务 / 输入 / 结果 / 检查点</text>
  <text x="62" y="650" class="small">持续保存证据，等待人工不重置预算</text>
  <rect x="426" y="556" width="348" height="126" rx="14" fill="#fff" stroke="#d7e0ee"/>
  <text x="448" y="591" class="heading">资源样例与工艺规则</text>
  <text x="448" y="620" class="label">机床 / 刀具 / 几何 / 工序状态</text>
  <text x="448" y="650" class="small">样例匹配不能证明现场可用性</text>
  <rect x="812" y="556" width="348" height="126" rx="14" fill="#fff" stroke="#d7e0ee"/>
  <text x="834" y="591" class="heading">可选知识与经验</text>
  <text x="834" y="620" class="label">RAG 资料 / 腾讯历史记忆</text>
  <text x="834" y="650" class="small">参考上下文，不覆盖当前输入与规则</text>
  <text x="40" y="717" class="small">部署边界：loopback 单进程；没有多用户权限、分布式租约或设备执行 / 生产放行接口。</text>
</svg>
