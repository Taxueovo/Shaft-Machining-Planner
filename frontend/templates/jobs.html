<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务中心 · {{ product.name }}</title><link rel="stylesheet" href="/static/styles.css?v={{ static_version }}"></head>
<body class="app-frame">{% from '_chrome.html' import chrome with context %}{{ chrome('任务中心') }}
<main id="main-content" class="shell workspace" tabindex="-1">
<div class="page-heading"><div><span class="eyebrow">PLANNING HISTORY</span><h1>任务中心</h1><p>查找规划记录，继续待确认任务，或从保存的输入重新规划。</p></div><a href="/custom" class="button primary">＋ 新建规划</a></div>
<section class="panel"><form id="jobs-filter" class="jobs-filter"><label class="search-field">查找任务<input id="job-search" type="search" maxlength="100" placeholder="零件名称、材料或任务编号"></label><label>状态<select id="job-filter"><option value="">全部状态</option><option value="active">全部执行中</option><option value="waiting">全部待确认</option><option value="running">执行中</option><option value="queued">排队中</option><option value="waiting_user_choice">待工艺选择</option><option value="waiting_engineering_input">待工程信息</option><option value="completed">已生成方案</option><option value="resource_mismatch">资源不匹配</option><option value="failed">执行失败</option><option value="interrupted">重启中断</option><option value="cancelling">正在取消</option><option value="cancelled">已取消</option></select></label><button class="button primary" type="submit">查找</button><button id="jobs-refresh" class="button ghost" type="button">刷新</button></form>
<div id="jobs-feedback" role="status" aria-live="polite" class="muted"></div><div id="jobs-list" class="list-placeholder">正在读取任务…</div><div class="pagination"><span id="jobs-count" class="muted"></span><div><button id="jobs-prev" class="button ghost" disabled>上一页</button><button id="jobs-next" class="button ghost" disabled>下一页</button></div></div></section>
<p class="workspace-footnote">历史输入保存在本机。重新规划会创建独立任务，并保留原记录。服务重启后保留等待中的工程问题；中断执行的任务需要从输入重新规划。</p></main>
<script src="/static/jobs.js?v={{ static_version }}" defer></script><script src="/static/heartbeat.js?v={{ static_version }}"></script></body></html>
